name: united_kites
description: "United Kites ZATCA billing — van sales, wholesale SKUs, 80mm thermal print."
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  qr_flutter: ^4.1.0
  pdf: ^3.13.0
  printing: ^5.15.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  crypto: ^3.0.6
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  idb_shim: ^2.9.9
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: assets/logo.jpg
  web:
    generate: true
    image_path: assets/logo.jpg
    background_color: "#FFFFFF"
    theme_color: "#CE2029"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
